name: Run VRChat API Tracker

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min; GitHub may delay it a few minutes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Saved session: restores the newest one, saves a fresh copy after the run
      - name: Restore VRChat session
        uses: actions/cache@v4
        with:
          path: .vrc-session
          key: vrc-session-${{ github.run_id }}
          restore-keys: vrc-session-

      - name: Fetch VRChat group data
        run: node scripts/fetch-vrc.mjs
        env:
          VRCHAT_USERNAME: ${{ vars.VRCHAT_USERNAME }}
          VRCHAT_PASSWORD: ${{ secrets.VRCHAT_PASSWORD }}
          VRCHAT_KEY: ${{ secrets.VRCHAT_KEY }}
          VRCHAT_GROUP_ID: ${{ vars.VRCHAT_GROUP_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

const API = 'https://api.vrchat.cloud/api/1';
const UA = 'kushCOOKIES-widget/1.0 (contact: jaystar25@aol.com)';
const CACHE_MS = 120000;     // reuse the last good result for 2 minutes
const COOLDOWN_MS = 300000;  // after a failure, wait 5 minutes before trying to log in again

const HEADERS = {
  'Access-Control-Allow-Origin': '*',
  'Content-Type': 'application/json',
  'Cache-Control': 'public, max-age=60',
};
const NO_CACHE = { ...HEADERS, 'Cache-Control': 'no-store' };

let memo = { t: 0, data: null };
let fail = { t: 0, msg: '' };

// ---------- TOTP (RFC 6238) ----------
function b32(s) {
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = '';
  for (const c of s.replace(/[\s=]/g, '').toUpperCase()) bits += a.indexOf(c).toString(2).padStart(5, '0');
  const out = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(out);
}
async function totp(secret) {
  const counter = new ArrayBuffer(8);
  new DataView(counter).setBigUint64(0, BigInt(Math.floor(Date.now() / 30000)));
  const key = await crypto.subtle.importKey('raw', b32(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, counter));
  const o = h[h.length - 1] & 15;
  const n = (((h[o] & 0x7f) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3]) % 1000000;
  return String(n).padStart(6, '0');
}

// ---------- Cookie jar ----------
const cookieStr = jar => Object.entries(jar).map(([k, v]) => `${k}=${v}`).join('; ');
function absorb(res, jar) {
  for (const sc of res.headers.getSetCookie()) {
    const [pair] = sc.split(';');
    const i = pair.indexOf('=');
    const k = pair.slice(0, i).trim(), v = pair.slice(i + 1);
    if (v) jar[k] = v; else delete jar[k];
  }
}
async function vrc(path, jar, init = {}) {
  const res = await fetch(API + path, {
    ...init,
    headers: { 'User-Agent': UA, Cookie: cookieStr(jar), ...(init.headers || {}) },
  });
  absorb(res, jar);
  return res;
}

// ---------- Login (only when the saved session is missing/expired) ----------
async function login(env, jar) {
  for (const k of Object.keys(jar)) delete jar[k];
  const basic = btoa(`${encodeURIComponent(env.VRCHAT_USERNAME)}:${encodeURIComponent(env.VRCHAT_PASSWORD)}`);

  let res = await vrc('/auth/user', jar, { headers: { Authorization: `Basic ${basic}` } });
  const body = await res.json();
  if (!res.ok) throw new Error(`login failed ${res.status} (check VRCHAT_USERNAME / VRCHAT_PASSWORD)`);

  if (body.requiresTwoFactorAuth) {
    if (!body.requiresTwoFactorAuth.includes('totp'))
      throw new Error('account must use an authenticator app (TOTP) for 2FA');
    res = await vrc('/auth/twofactorauth/totp/verify', jar, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: await totp(env.VRCHAT_TOTP_SECRET) }),
    });
    const v = await res.json();
    if (!res.ok || !v.verified) throw new Error(`2FA verification failed (${res.status}) - the TOTP secret is probably wrong`);
  }
  await env.VRC_KV.put('session', JSON.stringify(jar));
}

// ---------- Stats ----------
async function fetchStats(env) {
  for (const k of ['VRCHAT_USERNAME', 'VRCHAT_PASSWORD', 'VRCHAT_TOTP_SECRET', 'GROUP_ID'])
    if (!env[k]) throw new Error(`missing variable ${k}`);
  if (!env.VRC_KV) throw new Error('missing KV binding VRC_KV');

  const jar = JSON.parse((await env.VRC_KV.get('session')) || '{}');
  const gid = env.GROUP_ID;

  let g = jar.auth ? await vrc(`/groups/${gid}`, jar) : null;
  if (!g || g.status === 401) {
    await login(env, jar);
    g = await vrc(`/groups/${gid}`, jar);
  }
  if (!g.ok) throw new Error(`group fetch failed ${g.status} (check GROUP_ID starts with grp_ and the account is in the group)`);
  const group = await g.json();

  const i = await vrc(`/groups/${gid}/instances`, jar);
  const inst = i.ok ? await i.json() : [];

  return {
    members: group.memberCount ?? 0,
    onlineMembers: group.onlineMemberCount ?? 0,
    instanceCount: Array.isArray(inst) ? inst.length : 0,
  };
}

export default {
  async fetch(req, env) {
    if (req.method === 'OPTIONS') return new Response(null, { headers: HEADERS });

    // Private test: compare this code with your authenticator app. Remove DEBUG_KEY when done.
    const url = new URL(req.url);
    if (env.DEBUG_KEY && url.searchParams.get('codecheck') === env.DEBUG_KEY) {
      const s = env.VRCHAT_TOTP_SECRET || '';
      return new Response(JSON.stringify({
        codeNow: s ? await totp(s) : null,
        secretLength: s.replace(/[\s=]/g, '').length,
        badCharacters: (s.match(/[^A-Za-z2-7\s=]/g) || []).length,
      }), { headers: NO_CACHE });
    }

    const now = Date.now();

    if (fail.msg && now - fail.t < COOLDOWN_MS) {
      if (memo.data) return new Response(JSON.stringify(memo.data), { headers: HEADERS });
      return new Response(JSON.stringify({ error: fail.msg, retryInSeconds: Math.ceil((COOLDOWN_MS - (now - fail.t)) / 1000) }), { status: 502, headers: NO_CACHE });
    }

    if (memo.data && now - memo.t < CACHE_MS)
      return new Response(JSON.stringify(memo.data), { headers: HEADERS });

    try {
      memo = { t: now, data: await fetchStats(env) };
      fail = { t: 0, msg: '' };
      return new Response(JSON.stringify(memo.data), { headers: HEADERS });
    } catch (e) {
      fail = { t: now, msg: String(e.message) };
      if (memo.data) return new Response(JSON.stringify(memo.data), { headers: HEADERS });
      return new Response(JSON.stringify({ error: fail.msg }), { status: 502, headers: NO_CACHE });
    }
  },
};
